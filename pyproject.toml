[project]
name = "manimations"
version = "0.1.0"
description = "AI-Powered Manim & Voiceover Studio"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "edge-tts>=7.2.8",
    "manim>=0.18.0",
    "manim-voiceover[gtts,pyttsx3]>=0.3.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
